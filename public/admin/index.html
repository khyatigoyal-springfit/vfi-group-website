<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Admin | VFI Group</title>
<link rel="icon" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js" defer></script>
<script src="/admin/js/account.js" defer></script>
<script src="/admin/js/enquiries.js" defer></script>
<script src="/admin/js/form.js" defer></script>
<script src="/admin/js/media.js" defer></script>
<script src="/admin/js/image-field.js" defer></script>
<script src="/admin/js/content.js" defer></script>
<script src="/admin/js/publish.js" defer></script>
<script src="/admin/js/history.js" defer></script>
<script src="/admin/js/users.js" defer></script>
<script src="/admin/js/audit.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app">
  <header class="top">
    <div class="top-in">
      <button type="button" id="menuBtn" class="btn btn-ghost-dk menu-btn" aria-expanded="false" aria-controls="sidenav" hidden>Menu</button>
      <a class="brand" href="#/" aria-label="VFI Group admin"><img src="/assets/img/logo-ivory.png" alt="VFI Group" height="26"><span class="brand-sub">Admin</span></a>
      <div id="topUser" class="top-user" hidden>
        <span class="who-top"><span id="userName" class="who-name"></span><span id="userRole" class="role-pill"></span></span>
        <button type="button" id="logoutBtn" class="btn btn-ghost-dk">Sign out</button>
      </div>
    </div>
  </header>
  <div class="shell" id="shell">
    <nav id="sidenav" class="side" aria-label="Main" hidden><ul id="navList" class="nav-list"></ul></nav>
    <main id="main" tabindex="-1">
      <noscript><p class="notice">This admin area needs JavaScript. Please enable it and reload.</p></noscript>

      <section id="bootView" class="center" aria-live="polite"><p class="muted">Loading…</p></section>

      <section id="loginView" class="center" hidden>
        <form id="loginForm" class="card login" novalidate>
          <img src="/assets/img/logo-blue.png" alt="" height="30" class="login-logo">
          <h1>Sign in</h1>
          <p class="muted">Admin area for the VFI Group team.</p>
          <p id="loginMsg" class="msg" role="alert" hidden></p>
          <div class="field">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" autocomplete="username" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="field">
            <label for="loginPw">Password</label>
            <input id="loginPw" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Sign in</button>
        </form>
      </section>

      <section id="forceView" class="center" hidden></section>

      <div id="view" hidden></div>
    </main>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
